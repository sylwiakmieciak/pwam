
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibrate</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 100%;
    max-width: 350px;
    padding: 25px;
    text-align: center;
}

h1 {
    font-size: 25px;
    font-weight: 500;
    letter-spacing: 2px;
    margin-bottom: 35px;
}

button {
    width: 100%;
    padding: 20px;
    border: none;
    border-radius: 8px;
    background: #38bdf8;
    color: #111;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    background: #0ea5e9;
}

#status {
    margin-top: 20px;
    color: #888;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

    <h1>VIBRATE</h1>

    <button onclick="vibratePhone()">
        VIBRATE 1 SECOND
    </button>

    <div id="status">READY</div>

</div>

<script>

function vibratePhone() {

    if (!("vibrate" in navigator)) {
        document.getElementById("status").innerText =
            "NOT SUPPORTED";
        return;
    }

    const result = navigator.vibrate(1000);

    document.getElementById("status").innerText =
        result ? "VIBRATION SENT" : "NOT AVAILABLE";
}

</script>

</body>
</html>
