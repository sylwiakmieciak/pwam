
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screen Orientation</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 100%;
    text-align: center;
}

h1 {
    font-size: 18px;
    color: #888;
    letter-spacing: 2px;
}

#orientation {
    font-size: 48px;
    font-weight: bold;
    color: #38bdf8;
    margin: 35px 0;
}

#dimensions {
    color: #888;
    font-family: monospace;
    font-size: 14px;
}

</style>
</head>

<body>

<div class="container">

    <h1>SCREEN ORIENTATION</h1>

    <div id="orientation">---</div>

    <div id="dimensions">WAITING</div>

</div>

<script>

function detectOrientation() {

    const width = window.innerWidth;
    const height = window.innerHeight;

    const isLandscape = width > height;

    document.getElementById("orientation").innerText =
        isLandscape ? "POZIOM" : "PION";

    document.getElementById("dimensions").innerText =
        "WIDTH: " + width + " | HEIGHT: " + height;
}

window.addEventListener("resize", detectOrientation);
window.addEventListener("orientationchange", detectOrientation);

if (screen.orientation) {
    screen.orientation.addEventListener("change", detectOrientation);
}

detectOrientation();

</script>

</body>
</html>
