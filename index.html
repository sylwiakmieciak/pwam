
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screen Orientation</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    text-align: center;
    width: 100%;
    padding: 20px;
}

h1 {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 2px;
    color: #888;
}

#orientation {
    font-size: 48px;
    font-weight: bold;
    margin-top: 35px;
    color: #38bdf8;
}

#status {
    color: #777;
    font-size: 13px;
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

    <h1>SCREEN ORIENTATION</h1>

    <div id="orientation">---</div>

    <div id="status">WAITING</div>

</div>

<script>

function detectOrientation() {

    let width = window.innerWidth;
    let height = window.innerHeight;

    if (width > height) {
        document.getElementById("orientation").innerText = "POZIOM";
    } else {
        document.getElementById("orientation").innerText = "PION";
    }

    document.getElementById("status").innerText = "ACTIVE";
}

// Pierwszy odczyt
detectOrientation();

// Aktualizacja po obróceniu ekranu
window.addEventListener("resize", detectOrientation);
window.addEventListener("orientationchange", detectOrientation);

</script>

</body>
</html>
