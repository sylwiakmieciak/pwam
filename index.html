
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screen Orientation</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    text-align: center;
}

h1 {
    font-size: 18px;
    color: #888;
    letter-spacing: 2px;
}

#orientation {
    font-size: 48px;
    font-weight: bold;
    color: #38bdf8;
    margin: 35px 0;
}

#status {
    color: #777;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

    <h1>SCREEN ORIENTATION</h1>

    <div id="orientation">---</div>

    <div id="status">WAITING</div>

</div>

<script>

function detectOrientation() {

    let type = screen.orientation?.type;

    let isLandscape;

    if (type) {
        isLandscape = type.includes("landscape");
    } else {
        isLandscape = window.innerWidth > window.innerHeight;
    }

    document.getElementById("orientation").innerText =
        isLandscape ? "POZIOM" : "PION";

    document.getElementById("status").innerText =
        "ACTIVE";
}

// Aktualizacja
detectOrientation();

window.addEventListener("resize", detectOrientation);
window.addEventListener("orientationchange", detectOrientation);

if (screen.orientation) {
    screen.orientation.addEventListener(
        "change",
        detectOrientation
    );
}

// Dodatkowe sprawdzanie co 300 ms
setInterval(detectOrientation, 300);

</script>

</body>
</html>
